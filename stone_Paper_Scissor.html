<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissor Game</title>
    <link rel="stylesheet" href="stone_Paper_Scissor.css">
    
</head>

<body>
    <h1>Rock Paper Scissor</h1>
    <div class="choice">
        <div class="choices" id="rock">
            <img src="rock.png">
        </div>
        <div class="choices" id="paper">
            <img src="paper.png">
        </div>
        <div class="choices" id="scissor">
            <img src="scissors.png">
        </div>
    </div>

    <div class="score-board">
        <div class="score">
            <p id="user-scr">0</p>
            <p>Human</p>
        </div>

        <div class="score">
            <p id="comp-scr">0</p>
            <p>Computer</p>
        </div>
    </div>

    <div class="msg-container">
        <p id="msg">Take Your Pick</p>
    </div>
    
    <script src="stone_Paper_Scissor.js"></script>
</body>
</html>
